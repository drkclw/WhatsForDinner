name: Deploy Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-azure.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/**'

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  APP_SERVICE_NAME: ${{ vars.AZURE_APP_SERVICE_NAME }}
  APP_SERVICE_PLAN_NAME: ${{ vars.AZURE_APP_SERVICE_PLAN_NAME }}
  STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
  POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
  POSTGRES_DATABASE_NAME: ${{ vars.AZURE_POSTGRES_DATABASE_NAME }}
  KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  OPENAI_ENDPOINT: ${{ vars.OPENAI_ENDPOINT }}
  FRONTEND_ALLOWED_ORIGIN: ${{ vars.FRONTEND_ALLOWED_ORIGIN }}
  POSTGRES_ADMIN_LOGIN: ${{ vars.AZURE_POSTGRES_ADMIN_LOGIN || 'wfdadmin' }}

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Azure configuration
        shell: pwsh
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.AZURE_JWT_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'AZURE_RESOURCE_GROUP',
            'AZURE_LOCATION',
            'AZURE_APP_SERVICE_NAME',
            'AZURE_APP_SERVICE_PLAN_NAME',
            'AZURE_STATIC_WEB_APP_NAME',
            'AZURE_POSTGRES_SERVER_NAME',
            'AZURE_POSTGRES_DATABASE_NAME',
            'AZURE_KEY_VAULT_NAME',
            'GOOGLE_CLIENT_ID',
            'OPENAI_ENDPOINT',
            'FRONTEND_ALLOWED_ORIGIN',
            'POSTGRES_ADMIN_PASSWORD',
            'JWT_SIGNING_KEY',
            'OPENAI_API_KEY'
          )

          $missing = foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $name
            }
          }

          if ($missing) {
            throw ("Missing required workflow variables: {0}" -f ($missing -join ', '))
          }

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight what-if
        shell: bash
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.AZURE_JWT_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            location="$LOCATION" \
            staticWebAppName="$STATIC_WEB_APP_NAME" \
            appServicePlanName="$APP_SERVICE_PLAN_NAME" \
            appServiceName="$APP_SERVICE_NAME" \
            postgresServerName="$POSTGRES_SERVER_NAME" \
            postgresDatabaseName="$POSTGRES_DATABASE_NAME" \
            keyVaultName="$KEY_VAULT_NAME" \
            postgresAdministratorLogin="$POSTGRES_ADMIN_LOGIN" \
            postgresAdministratorPassword="$POSTGRES_ADMIN_PASSWORD" \
            googleClientId="$GOOGLE_CLIENT_ID" \
            jwtSigningKey="$JWT_SIGNING_KEY" \
            openAiApiKey="$OPENAI_API_KEY" \
            openAiEndpoint="$OPENAI_ENDPOINT" \
            frontendAllowedOrigin="$FRONTEND_ALLOWED_ORIGIN"

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep templates
        shell: bash
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.AZURE_JWT_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            location="$LOCATION" \
            staticWebAppName="$STATIC_WEB_APP_NAME" \
            appServicePlanName="$APP_SERVICE_PLAN_NAME" \
            appServiceName="$APP_SERVICE_NAME" \
            postgresServerName="$POSTGRES_SERVER_NAME" \
            postgresDatabaseName="$POSTGRES_DATABASE_NAME" \
            keyVaultName="$KEY_VAULT_NAME" \
            postgresAdministratorLogin="$POSTGRES_ADMIN_LOGIN" \
            postgresAdministratorPassword="$POSTGRES_ADMIN_PASSWORD" \
            googleClientId="$GOOGLE_CLIENT_ID" \
            jwtSigningKey="$JWT_SIGNING_KEY" \
            openAiApiKey="$OPENAI_API_KEY" \
            openAiEndpoint="$OPENAI_ENDPOINT" \
            frontendAllowedOrigin="$FRONTEND_ALLOWED_ORIGIN"

      - name: Verify no Azure OpenAI resources were deployed
        shell: bash
        run: |
          set -euo pipefail
          resource_count=$(az resource list --resource-group "$RESOURCE_GROUP" --query "[?type=='Microsoft.CognitiveServices/accounts'] | length(@)" -o tsv)
          if [ "$resource_count" != "0" ]; then
            echo "Found disallowed Cognitive Services accounts in resource group $RESOURCE_GROUP"
            exit 1
          fi

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish backend
        run: dotnet publish backend/src/WhatsForDinner.Api/WhatsForDinner.Api.csproj --configuration Release --output backend/publish

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_SERVICE_NAME }}
          package: backend/publish

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://${{ env.APP_SERVICE_NAME }}.azurewebsites.net/api
        run: npm run build

      - name: Fetch Static Web App deployment token
        id: swa-token
        shell: bash
        run: |
          set -euo pipefail
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --query properties.apiKey -o tsv)
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}

  summarize:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - deploy-infrastructure
      - deploy-backend
      - deploy-frontend
    if: ${{ always() }}
    steps:
      - name: Summarize stage results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @(
            "Infrastructure deployment: ${{ needs.deploy-infrastructure.result }}",
            "Backend deployment: ${{ needs.deploy-backend.result }}",
            "Frontend deployment: ${{ needs.deploy-frontend.result }}"
          )

          $summary -join [Environment]::NewLine | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append